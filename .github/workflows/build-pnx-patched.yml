name: Build Patched PowerNukkitX

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-pnx-patched.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Clone PowerNukkitX 3.0.3
        run: |
          git clone --depth 1 --branch 3.0.3 https://github.com/PowerNukkitX/PowerNukkitX.git pnx
          cd pnx
          git rev-parse --short HEAD

      - name: Patch negative clay-band index crash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('pnx/src/main/java/org/powernukkitx/level/generator/stages/normal/NormalSurfaceOverwriteStage.java')
          text = path.read_text()
          old = 'return bands[(y + offset + bands.length) % bands.length];'
          new = 'return bands[Math.floorMod(y + offset, bands.length)];'
          if old not in text:
              raise SystemExit('Expected PowerNukkitX 3.0.3 clay-band expression was not found; refusing to build an unverified patch.')
          path.write_text(text.replace(old, new, 1))
          PY
          grep -n 'floorMod' pnx/src/main/java/org/powernukkitx/level/generator/stages/normal/NormalSurfaceOverwriteStage.java

      - name: Build patched server
        working-directory: pnx
        run: |
          chmod +x gradlew
          ./gradlew assemble --no-daemon --parallel --max-workers=2 --stacktrace

      - name: Prepare patched JAR
        run: |
          set -euo pipefail
          mkdir -p artifact
          JAR=$(find pnx/build/libs -maxdepth 1 -type f -name '*.jar' -printf '%s\t%p\n' | sort -nr | head -1 | cut -f2-)
          test -n "$JAR"
          cp "$JAR" artifact/powernukkitx-3.0.3-ioslinuxkit-patched.jar
          test $(stat -c%s artifact/powernukkitx-3.0.3-ioslinuxkit-patched.jar) -gt 10000000
          sha256sum artifact/powernukkitx-3.0.3-ioslinuxkit-patched.jar
          ls -lh artifact/powernukkitx-3.0.3-ioslinuxkit-patched.jar

      - name: Upload patched PowerNukkitX
        uses: actions/upload-artifact@v4
        with:
          name: powernukkitx-ioslinuxkit-patched
          path: artifact/powernukkitx-3.0.3-ioslinuxkit-patched.jar
          if-no-files-found: error
