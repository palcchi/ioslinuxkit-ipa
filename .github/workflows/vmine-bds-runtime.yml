name: V-MINE Dragonfly Runtime

on:
  push:
    branches:
      - x86_64-guest
  workflow_dispatch:

jobs:
  dragonfly-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout Dragonfly
        uses: actions/checkout@v4
        with:
          repository: df-mc/dragonfly
          ref: master
          path: dragonfly

      - uses: actions/setup-go@v5
        with:
          go-version-file: dragonfly/go.mod
          cache-dependency-path: dragonfly/go.sum

      - name: Apply x86_64 compatibility patches
        shell: bash
        run: |
          set -euo pipefail
          for p in tests/x86_64/patch_glibc_*.py; do python3 "$p"; done

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld meson ninja-build libsqlite3-dev libarchive-dev busybox-static

      - name: Build V-MINE and Dragonfly
        shell: bash
        run: |
          set -euo pipefail
          meson setup build-x86_64 -Dguest_arch=x86_64 --buildtype=release
          ninja -C build-x86_64
          mkdir -p dragonfly-root/bin
          cp /bin/busybox dragonfly-root/bin/sh
          (
            cd dragonfly
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o ../dragonfly-root/vmine-dragonfly .
          )
          cp dragonfly/config.toml dragonfly-root/config.toml
          chmod 755 dragonfly-root/vmine-dragonfly
          tar --numeric-owner -C dragonfly-root -cf dragonfly-rootfs.tar .
          ./build-x86_64/tools/fakefsify dragonfly-rootfs.tar dragonfly-fakefs

      - name: Run and verify Dragonfly UDP 19132
        shell: bash
        run: |
          set +e
          setsid timeout --foreground 600 ./build-x86_64/ish -f dragonfly-fakefs /bin/sh -c 'cd / && exec /vmine-dragonfly' >dragonfly.log 2>&1 &
          vmine_pid=$!
          set -e
          for attempt in $(seq 1 120); do
            if grep -Eqi ':[[:space:]]*4ABC[[:space:]]' /proc/net/udp /proc/net/udp6 2>/dev/null; then
              echo udp-19132 > dragonfly-startup.ok
              break
            fi
            if ! kill -0 "$vmine_pid" 2>/dev/null; then break; fi
            sleep 5
          done
          if [ -f dragonfly-startup.ok ]; then kill -- "-$vmine_pid" 2>/dev/null || true; fi
          set +e
          wait "$vmine_pid"
          runtime_rc=$?
          set -e
          tail -n 300 dragonfly.log
          echo "DRAGONFLY_RUNTIME_RC=$runtime_rc"
          test -f dragonfly-startup.ok
          echo 'V-MINE DRAGONFLY STARTUP: UDP 19132 OPEN'

      - name: Upload Dragonfly logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vmine-dragonfly-runtime
          path: |
            dragonfly.log
            dragonfly-startup.ok
