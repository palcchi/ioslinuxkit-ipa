name: V-MINE BDS Runtime

on:
  push:
    branches:
      - x86_64-guest
  workflow_dispatch:

jobs:
  bds-runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply x86_64 compatibility patches
        shell: bash
        run: |
          set -euo pipefail
          for p in tests/x86_64/patch_glibc_*.py; do
            echo "==> applying $p"
            python3 "$p"
          done

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld meson ninja-build libsqlite3-dev libarchive-dev unzip

      - name: Build V-MINE x86_64 runtime
        run: |
          meson setup build-x86_64 -Dguest_arch=x86_64 --buildtype=release
          ninja -C build-x86_64

      - name: Build Jammy plus official BDS rootfs
        shell: bash
        run: |
          set -euo pipefail
          BDS_VERSION=1.26.44.3
          BDS_URL="https://www.minecraft.net/bedrockdedicatedserver/bin-linux/bedrock-server-${BDS_VERSION}.zip"

          wget -q -O jammy-base.tar.gz https://cdimage.ubuntu.com/ubuntu-base/releases/jammy/release/ubuntu-base-22.04.5-base-amd64.tar.gz
          rm -rf bds-root bds-fakefs bds-rootfs.tar bds.zip bds-debs
          mkdir bds-root
          tar -xzf jammy-base.tar.gz -C bds-root

          cat <<'EOF' | sudo tee /etc/apt/sources.list.d/bds-jammy.list >/dev/null
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy main universe
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-updates main universe
          deb [arch=amd64] http://security.ubuntu.com/ubuntu jammy-security main universe
          EOF
          sudo apt-get update >/dev/null
          mkdir bds-debs
          (
            cd bds-debs
            apt-get download libstdc++6:amd64/jammy-updates || apt-get download libstdc++6:amd64/jammy
            apt-get download libgcc-s1:amd64/jammy-updates || apt-get download libgcc-s1:amd64/jammy
          )
          for deb in bds-debs/*.deb; do
            dpkg-deb -x "$deb" bds-root
          done

          wget -q -O bds.zip "$BDS_URL"
          unzip -q bds.zip -d bds-root
          chmod +x bds-root/bedrock_server

          # Materialize the dynamic loader instead of relying on /lib64's
          # symlink surviving fakefs conversion.
          loader_src='bds-root/lib/x86_64-linux-gnu/ld-linux-x86-64.so.2'
          if [ ! -f "$loader_src" ]; then
            loader_src='bds-root/usr/lib/x86_64-linux-gnu/ld-linux-x86-64.so.2'
          fi
          test -f "$loader_src"
          mkdir -p bds-root/lib64
          rm -f bds-root/lib64/ld-linux-x86-64.so.2
          cp -L "$loader_src" bds-root/lib64/ld-linux-x86-64.so.2
          chmod 0755 bds-root/lib64/ld-linux-x86-64.so.2

          echo '--- PT_INTERP ---'
          readelf -l bds-root/bedrock_server | grep -E 'interpreter|Requesting' || true
          echo '--- loader ---'
          file bds-root/lib64/ld-linux-x86-64.so.2

          tar --numeric-owner -C bds-root -cf bds-rootfs.tar .
          ./build-x86_64/tools/fakefsify bds-rootfs.tar bds-fakefs

      - name: Verify BDS fakefs guest visibility
        shell: bash
        run: |
          set -euo pipefail
          timeout 20 ./build-x86_64/ish -f bds-fakefs /bin/ls -l /lib64/ld-linux-x86-64.so.2 /bedrock_server 2>&1 | tee bds-visibility.log

      - name: Run BDS through explicit dynamic loader
        shell: bash
        run: |
          set +e
          timeout 90 ./build-x86_64/ish -f bds-fakefs /lib64/ld-linux-x86-64.so.2 /bedrock_server >bds-loader.log 2>&1
          echo $? > bds-loader.rc
          set -e
          cat bds-loader.log
          echo "BDS_LOADER_RC=$(cat bds-loader.rc)"

      - name: Run BDS through normal ELF exec
        shell: bash
        run: |
          set +e
          timeout 90 ./build-x86_64/ish -f bds-fakefs /bedrock_server >bds-normal.log 2>&1
          echo $? > bds-normal.rc
          set -e
          cat bds-normal.log
          echo "BDS_NORMAL_RC=$(cat bds-normal.rc)"

      - name: Evaluate V-MINE BDS frontier
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eqi 'server started|IPv4 supported|19132|Dedicated Server' bds-loader.log bds-normal.log; then
            echo 'V-MINE BDS STARTUP FRONTIER: REACHED'
            exit 0
          fi

          echo '--- loader frontier ---'
          grep -E -m1 -B5 -A20 'illegal instruction|segmentation|not found|not implemented|undefined|error while loading shared libraries|failed|fatal|x86-gpf|x86-undefined' bds-loader.log || tail -80 bds-loader.log || true
          echo '--- normal exec frontier ---'
          grep -E -m1 -B5 -A20 'illegal instruction|segmentation|not found|not implemented|undefined|error while loading shared libraries|failed|fatal|x86-gpf|x86-undefined' bds-normal.log || tail -80 bds-normal.log || true
          exit 1

      - name: Upload BDS logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vmine-bds-frontier
          path: |
            bds-loader.log
            bds-normal.log
            bds-loader.rc
            bds-normal.rc
            bds-visibility.log
