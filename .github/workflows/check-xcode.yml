name: Check iSH Xcode

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Xcode version
        run: xcodebuild -version

      - name: List project
        run: xcodebuild -project iSH.xcodeproj -list

      - name: Show ARM64 scheme
        run: |
          xcodebuild -project iSH.xcodeproj -list -json
