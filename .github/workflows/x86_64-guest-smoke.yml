name: x86_64 Direct Guest Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - x86_64-guest
    paths:
      - 'meson.build'
      - 'meson_options.txt'
      - 'emu/**'
      - 'asbestos/x86_64_stub.c'
      - 'kernel/**'
      - 'vdso/x86_64/**'
      - 'tests/x86_64/**'
      - '.github/workflows/x86_64-guest-smoke.yml'

jobs:
  direct-interpreter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply glibc bring-up patches
        run: |
          set -euo pipefail
          for p in tests/x86_64/patch_glibc_*.py; do python3 "$p"; done
      - name: Build direct x86_64 interpreter smoke
        run: |
          set -euo pipefail
          clang -std=gnu11 -Wall -Wextra \
            -DGUEST_X86_64=1 -I. \
            tests/x86_64/direct_guest_smoke.c \
            emu/arch/x86_64/interp.c \
            -o x86_64-direct-smoke
      - name: Run direct x86_64 interpreter smoke
        run: ./x86_64-direct-smoke

  linuxkit-host-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Apply glibc bring-up patches
        run: |
          set -euo pipefail
          for p in tests/x86_64/patch_glibc_*.py; do python3 "$p"; done
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld meson ninja-build libsqlite3-dev libarchive-dev unzip
      - name: Configure direct x86_64 guest LinuxKit
        run: meson setup build-x86_64 -Dguest_arch=x86_64 --buildtype=release
      - name: Build LinuxKit x86_64 guest host binary
        run: ninja -C build-x86_64
      - name: Build static x86_64 guest ELF fixture
        run: |
          set -euo pipefail
          clang -target x86_64-linux-gnu -fuse-ld=lld \
            -nostdlib -static -no-pie \
            -Wl,--build-id=none -Wl,-e,_start -Wl,-Ttext=0x400000 \
            tests/x86_64/hello_guest.S -o hello-x86_64
          file hello-x86_64
          readelf -h hello-x86_64 | tee hello-elf-header.txt
          grep -q 'Class:.*ELF64' hello-elf-header.txt
          grep -q 'Machine:.*Advanced Micro Devices X86-64' hello-elf-header.txt
      - name: Build minimal fakefs
        run: |
          set -euo pipefail
          rm -rf x86-rootfs x86-rootfs-fakefs x86-rootfs.tar
          mkdir -p x86-rootfs/dev
          install -m 0755 hello-x86_64 x86-rootfs/hello-x86_64
          tar --numeric-owner -C x86-rootfs -cf x86-rootfs.tar .
          ./build-x86_64/tools/fakefsify x86-rootfs.tar x86-rootfs-fakefs
      - name: Run static ELF through full LinuxKit x86_64 guest
        run: |
          set -euo pipefail
          timeout 20 ./build-x86_64/ish -f x86-rootfs-fakefs /hello-x86_64 2>&1 | tee full-x86-elf.log
          grep -q '^HELLO X86_64 GUEST$' full-x86-elf.log
          echo 'FULL X86_64 ELF GUEST: PASS'

      - name: Diagnose runner glibc ISA property
        run: |
          echo '--- Ubuntu runner libc GNU properties ---'
          readelf -n /lib/x86_64-linux-gnu/libc.so.6 | grep -A8 -B2 -E 'ISA|GNU_PROPERTY' || true
          echo '--- Ubuntu runner loader GNU properties ---'
          readelf -n /lib64/ld-linux-x86-64.so.2 | grep -A8 -B2 -E 'ISA|GNU_PROPERTY' || true

      - name: Build Ubuntu 22.04 amd64 guest rootfs
        run: |
          set -euo pipefail
          wget -q -O jammy-base.tar.gz https://cdimage.ubuntu.com/ubuntu-base/releases/jammy/release/ubuntu-base-22.04.5-base-amd64.tar.gz
          rm -rf jammy-root jammy-fakefs jammy-rootfs.tar
          mkdir jammy-root
          tar -xzf jammy-base.tar.gz -C jammy-root
          echo '--- Jammy libc ---'
          file jammy-root/lib/x86_64-linux-gnu/libc.so.6
          readelf -n jammy-root/lib/x86_64-linux-gnu/libc.so.6 | grep -A8 -B2 -E 'ISA|GNU_PROPERTY' || true
          echo '--- Jammy echo ---'
          file jammy-root/bin/echo
          readelf -l jammy-root/bin/echo | grep -E 'interpreter|Requesting' || true
          tar --numeric-owner -C jammy-root -cf jammy-rootfs.tar .
          ./build-x86_64/tools/fakefsify jammy-rootfs.tar jammy-fakefs

      - name: Run Ubuntu 22.04 glibc through x86_64 guest
        run: |
          set -euo pipefail
          set +e
          ISH_SYSTRACE=1 timeout 30 ./build-x86_64/ish -f jammy-fakefs /bin/echo 'HELLO JAMMY GLIBC' >jammy-guest.log 2>&1
          rc=$?
          set -e
          cat jammy-guest.log
          echo "JAMMY_GUEST_RC=$rc"
          if grep -q '^HELLO JAMMY GLIBC$' jammy-guest.log; then
            echo 'JAMMY GLIBC X86_64 GUEST: PASS'
          else
            echo '--- first unsupported/failure context ---'
            grep -E -m1 -B3 -A8 'illegal instruction|segmentation|CPU ISA|not found|not implemented|undefined' jammy-guest.log || true
            exit 1
          fi

      - name: Download and prepare official Bedrock Dedicated Server
        run: |
          set -euo pipefail
          BDS_VERSION=1.26.44.3
          BDS_URL="https://www.minecraft.net/bedrockdedicatedserver/bin-linux/bedrock-server-${BDS_VERSION}.zip"
          rm -rf bds-root bds-fakefs bds-rootfs.tar bds.zip
          cp -a jammy-root bds-root

          # Ubuntu Base intentionally omits the C++ runtime and can also omit a
          # usable /tmp. apt runs helper processes as _apt, so make its temp
          # directory explicitly world-writable with the normal sticky bit.
          mkdir -p bds-root/tmp
          chmod 1777 bds-root/tmp
          cp /etc/resolv.conf bds-root/etc/resolv.conf
          sudo chroot bds-root /bin/sh -c 'apt-get update >/dev/null && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libstdc++6 libgcc-s1 ca-certificates >/dev/null'
          rm -rf bds-root/var/lib/apt/lists/*

          wget -O bds.zip "$BDS_URL"
          # Keep the complete BDS distribution at guest /. This makes the
          # guest's initial working directory and BDS relative resource paths
          # agree, while allowing direct exec without a shell wrapper.
          unzip -q bds.zip -d bds-root
          chmod +x bds-root/bedrock_server

          echo '--- BDS binary ---'
          file bds-root/bedrock_server
          readelf -h bds-root/bedrock_server | grep -E 'Class:|Machine:|Type:'
          echo '--- BDS interpreter ---'
          readelf -l bds-root/bedrock_server | grep -E 'interpreter|Requesting' || true
          echo '--- BDS NEEDED libraries ---'
          readelf -d bds-root/bedrock_server | grep NEEDED || true
          echo '--- BDS bundled shared objects ---'
          find bds-root -maxdepth 2 -type f -name '*.so*' -printf '%P\n' | sort || true
          echo '--- Guest-root dependency resolution ---'
          sudo chroot bds-root /usr/bin/ldd /bedrock_server || true

      - name: Build Bedrock Dedicated Server fakefs
        run: |
          set -euo pipefail
          tar --numeric-owner -C bds-root -cf bds-rootfs.tar .
          ./build-x86_64/tools/fakefsify bds-rootfs.tar bds-fakefs

      - name: Run official Bedrock Dedicated Server through x86_64 guest
        run: |
          set -euo pipefail
          set +e
          timeout 90 ./build-x86_64/ish -f bds-fakefs /bedrock_server >bds-guest.log 2>&1
          rc=$?
          set -e
          cat bds-guest.log
          echo "BDS_GUEST_RC=$rc"
          if grep -Eqi 'server started|IPv4 supported|19132|Dedicated Server' bds-guest.log; then
            echo 'OFFICIAL BEDROCK SERVER X86_64 GUEST: STARTUP REACHED'
            exit 0
          fi
          echo '--- Bedrock first failure/frontier ---'
          grep -E -m1 -B5 -A16 'illegal instruction|segmentation|not found|not implemented|undefined|error while loading shared libraries|failed|fatal|x86-gpf|x86-undefined' bds-guest.log || true
          exit 1
