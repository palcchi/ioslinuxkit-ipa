name: x86_64 Direct Guest Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - x86_64-guest
    paths:
      - 'meson.build'
      - 'meson_options.txt'
      - 'emu/**'
      - 'asbestos/x86_64_stub.c'
      - 'kernel/**'
      - 'vdso/x86_64/**'
      - 'tests/x86_64/**'
      - '.github/workflows/x86_64-guest-smoke.yml'

jobs:
  direct-interpreter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build direct x86_64 interpreter smoke
        run: |
          set -euo pipefail
          clang -std=gnu11 -Wall -Wextra \
            -DGUEST_X86_64=1 -I. \
            tests/x86_64/direct_guest_smoke.c \
            emu/arch/x86_64/interp.c \
            -o x86_64-direct-smoke
      - name: Run direct x86_64 interpreter smoke
        run: ./x86_64-direct-smoke

  linuxkit-host-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld meson ninja-build libsqlite3-dev libarchive-dev
      - name: Configure direct x86_64 guest LinuxKit
        run: |
          meson setup build-x86_64 -Dguest_arch=x86_64 --buildtype=release
      - name: Build LinuxKit x86_64 guest host binary
        run: |
          ninja -C build-x86_64
      - name: Build static x86_64 guest ELF fixture
        run: |
          set -euo pipefail
          clang -target x86_64-linux-gnu -fuse-ld=lld \
            -nostdlib -static -no-pie \
            -Wl,--build-id=none -Wl,-e,_start -Wl,-Ttext=0x400000 \
            tests/x86_64/hello_guest.S -o hello-x86_64
          file hello-x86_64
          readelf -h hello-x86_64 | tee hello-elf-header.txt
          grep -q 'Class:.*ELF64' hello-elf-header.txt
          grep -q 'Machine:.*Advanced Micro Devices X86-64' hello-elf-header.txt
          objdump -d hello-x86_64 | sed -n '/<_start>:/,+16p'
      - name: Build minimal fakefs
        run: |
          set -euo pipefail
          rm -rf x86-rootfs x86-rootfs-fakefs x86-rootfs.tar
          mkdir -p x86-rootfs/dev
          install -m 0755 hello-x86_64 x86-rootfs/hello-x86_64
          tar --numeric-owner -C x86-rootfs -cf x86-rootfs.tar .
          ./build-x86_64/tools/fakefsify x86-rootfs.tar x86-rootfs-fakefs
      - name: Run static ELF through full LinuxKit x86_64 guest
        run: |
          set -euo pipefail
          timeout 20 ./build-x86_64/ish -f x86-rootfs-fakefs /hello-x86_64 2>&1 | tee full-x86-elf.log
          grep -q '^HELLO X86_64 GUEST$' full-x86-elf.log
          echo 'FULL X86_64 ELF GUEST: PASS'
      - name: Build dynamic glibc x86_64 fixture
        run: |
          set -euo pipefail
          cat > hello-glibc.c <<'EOF'
          #include <unistd.h>
          int main(void) {
              static const char msg[] = "HELLO GLIBC X86_64 GUEST\n";
              return write(1, msg, sizeof(msg) - 1) == (ssize_t)(sizeof(msg) - 1) ? 0 : 1;
          }
          EOF
          gcc -O0 -fno-pie -no-pie hello-glibc.c -o hello-glibc
          file hello-glibc
          readelf -l hello-glibc | tee hello-glibc-phdr.txt
          grep -q '/lib64/ld-linux-x86-64.so.2' hello-glibc-phdr.txt
      - name: Build glibc fakefs
        run: |
          set -euo pipefail
          rm -rf glibc-rootfs glibc-rootfs-fakefs glibc-rootfs.tar
          mkdir -p glibc-rootfs/dev glibc-rootfs/lib64 glibc-rootfs/lib/x86_64-linux-gnu
          install -m 0755 hello-glibc glibc-rootfs/hello-glibc
          cp -L /lib64/ld-linux-x86-64.so.2 glibc-rootfs/lib64/ld-linux-x86-64.so.2
          cp -L /lib/x86_64-linux-gnu/libc.so.6 glibc-rootfs/lib/x86_64-linux-gnu/libc.so.6
          tar --numeric-owner -C glibc-rootfs -cf glibc-rootfs.tar .
          ./build-x86_64/tools/fakefsify glibc-rootfs.tar glibc-rootfs-fakefs
      - name: Probe glibc loader through x86_64 guest
        run: |
          set -euo pipefail
          set +e
          ISH_SYSTRACE=1 timeout 20 ./build-x86_64/ish -f glibc-rootfs-fakefs /hello-glibc >glibc-guest.log 2>&1
          rc=$?
          set -e
          cat glibc-guest.log
          echo "GLIBC_GUEST_RC=$rc"
          if grep -q '^HELLO GLIBC X86_64 GUEST$' glibc-guest.log; then
            echo 'GLIBC X86_64 GUEST: PASS'
            exit 0
          fi
          echo 'GLIBC X86_64 GUEST: EXPECTED BRING-UP FAILURE'
          exit 1
