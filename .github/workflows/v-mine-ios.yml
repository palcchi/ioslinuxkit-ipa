name: V-MINE Native iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - x86_64-guest
    paths:
      - 'app/**'
      - 'V-MINE.xcodeproj/**'
      - '.github/workflows/v-mine-ios.yml'

jobs:
  prepare-bds-rootfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Build Jammy amd64 runtime rootfs
        shell: bash
        run: |
          set -euo pipefail
          wget -q -O jammy-base.tar.gz https://cdimage.ubuntu.com/ubuntu-base/releases/jammy/release/ubuntu-base-22.04.5-base-amd64.tar.gz
          mkdir rootfs rootfs-debs
          tar -xzf jammy-base.tar.gz -C rootfs
          cat <<'EOF' | sudo tee /etc/apt/sources.list.d/vmine-jammy.list >/dev/null
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy main universe
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-updates main universe
          deb [arch=amd64] http://security.ubuntu.com/ubuntu jammy-security main universe
          EOF
          sudo apt-get update >/dev/null
          (
            cd rootfs-debs
            apt-get download busybox-static:amd64
            apt-get download libstdc++6:amd64/jammy-updates || apt-get download libstdc++6:amd64/jammy
            apt-get download libgcc-s1:amd64/jammy-updates || apt-get download libgcc-s1:amd64/jammy
          )
          for deb in rootfs-debs/*.deb; do dpkg-deb -x "$deb" rootfs; done
          busybox_path=$(find rootfs -type f -name busybox -print -quit)
          test -n "$busybox_path"
          if [ "$busybox_path" != "rootfs/bin/busybox" ]; then
            cp "$busybox_path" rootfs/bin/busybox
            chmod 755 rootfs/bin/busybox
          fi
          test -x rootfs/bin/busybox
          mkdir -p rootfs/opt/vmine/server rootfs/opt/vmine/data rootfs/opt/vmine/backups rootfs/ish
          tar --numeric-owner -C rootfs -czf vmine-jammy-amd64.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: vmine-jammy-amd64-rootfs
          path: vmine-jammy-amd64.tar.gz

  build-ios:
    needs: prepare-bds-rootfs
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout V-MINE
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version

      - name: Install build tools
        run: brew install meson ninja

      - name: Download BDS-ready amd64 rootfs
        uses: actions/download-artifact@v4
        with:
          name: vmine-jammy-amd64-rootfs
          path: prepared-rootfs

      - name: Apply verified x86_64 BDS compatibility patches
        shell: bash
        run: |
          set -euo pipefail
          for p in tests/x86_64/patch_glibc_*.py; do python3 "$p"; done

      - name: Build native V-MINE shell
        run: |
          set -o pipefail
          rm -rf build-vmine
          xcodebuild \
            -project V-MINE.xcodeproj \
            -scheme V-MINE-ARM64 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-vmine \
            ROOTFS_LOCAL_PATH="$PWD/prepared-rootfs/vmine-jammy-amd64.tar.gz" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee xcode-build.log

      - name: Show build errors
        if: failure()
        run: grep -E 'error:|fatal error:|BUILD FAILED' xcode-build.log | tail -120 || true

      - name: Package unsigned V-MINE IPA
        run: |
          set -euo pipefail
          APP=$(find build-vmine/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' | head -1)
          test -n "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist"
          rm -rf Payload V-MINE-preview.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry V-MINE-preview.ipa Payload
          ls -lh V-MINE-preview.ipa

      - name: Upload V-MINE IPA
        uses: actions/upload-artifact@v4
        with:
          name: V-MINE-Native-iOS-Preview
          path: V-MINE-preview.ipa
