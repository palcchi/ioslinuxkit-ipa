name: V-MINE Native iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - x86_64-guest
    paths:
      - 'app/**'
      - 'tests/x86_64/**'
      - 'V-MINE.xcodeproj/**'
      - '.github/workflows/v-mine-ios.yml'

jobs:
  prepare-dragonfly-rootfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Dragonfly
        uses: actions/checkout@v4
        with:
          repository: df-mc/dragonfly
          ref: master
          path: dragonfly

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: dragonfly/go.mod
          cache-dependency-path: dragonfly/go.sum

      - name: Build Alpine ARM64 Dragonfly rootfs
        shell: bash
        run: |
          set -euo pipefail
          wget -q -O alpine-arm64.tar.gz https://dl-cdn.alpinelinux.org/alpine/v3.24/releases/aarch64/alpine-minirootfs-3.24.0-aarch64.tar.gz
          mkdir rootfs
          tar -xzf alpine-arm64.tar.gz -C rootfs
          test -x rootfs/bin/busybox
          mkdir -p rootfs/opt/vmine/server rootfs/opt/vmine/data rootfs/opt/vmine/backups rootfs/ish
          (
            cd dragonfly
            CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o ../rootfs/usr/local/bin/vmine-dragonfly .
          )
          cp dragonfly/config.toml rootfs/usr/local/share/vmine-dragonfly-config.toml
          chmod 755 rootfs/usr/local/bin/vmine-dragonfly
          test -x rootfs/usr/local/bin/vmine-dragonfly
          tar --numeric-owner -C rootfs -czf vmine-alpine-arm64.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: vmine-dragonfly-arm64-rootfs
          path: vmine-alpine-arm64.tar.gz

  build-ios:
    needs: prepare-dragonfly-rootfs
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout V-MINE
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version

      - name: Install build tools
        run: brew install meson ninja llvm lld

      - name: Download Dragonfly-ready ARM64 rootfs
        uses: actions/download-artifact@v4
        with:
          name: vmine-dragonfly-arm64-rootfs
          path: prepared-rootfs

      - name: Build native V-MINE shell
        run: |
          set -o pipefail
          export PATH="$(brew --prefix llvm)/bin:$(brew --prefix lld)/bin:$PATH"
          rm -rf build-vmine
          xcodebuild \
            -project V-MINE.xcodeproj \
            -scheme V-MINE-ARM64 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-vmine \
            ROOTFS_LOCAL_PATH="$PWD/prepared-rootfs/vmine-alpine-arm64.tar.gz" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee xcode-build.log
          xcodebuild \
            -project V-MINE.xcodeproj \
            -target V-MINEFileProvider \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build-vmine/Build/Products" \
            OBJROOT="$PWD/build-vmine/Build/Intermediates.noindex" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee xcode-file-provider-build.log

      - name: Show build errors
        if: failure()
        run: grep -E 'error:|fatal error:|BUILD FAILED' xcode-build.log | tail -120 || true

      - name: Package unsigned V-MINE IPA
        run: |
          set -euo pipefail
          APP=$(find build-vmine/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' | head -1)
          APPEX=$(find build-vmine/Build/Products/Release-iphoneos -maxdepth 1 -type d -name 'V-MINEFileProvider.appex' | head -1)
          test -n "$APP"
          test -n "$APPEX"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist"
          mkdir -p "$APP/PlugIns"
          cp -R "$APPEX" "$APP/PlugIns/"
          test -f "$APP/PlugIns/V-MINEFileProvider.appex/Info.plist"
          rm -rf Payload V-MINE-preview.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry V-MINE-preview.ipa Payload
          ls -lh V-MINE-preview.ipa

      - name: Upload V-MINE IPA
        uses: actions/upload-artifact@v4
        with:
          name: V-MINE-Native-iOS-Preview
          path: V-MINE-preview.ipa
