name: Build iSH ARM64 IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version

      - name: List schemes
        run: xcodebuild -project iSH.xcodeproj -list

      - name: Install build tools
        run: |
          brew install meson ninja

      - name: Prepare iSH build
        run: |
          git submodule update --init --recursive

          echo "=== Searching for Ninja build files ==="
          find . -name "build.ninja" -o -name "CMakeLists.txt" | head -50

      - name: Inspect Dispatch header
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          sed -n '140,152p' "$SDK/usr/include/dispatch/base.h"

      - name: Inspect Apple SDK
        run: |
          echo "=== XCODE ==="
          xcodebuild -version
          echo "=== CLANG ==="
          clang --version
          echo "=== SDK ==="
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "$SDK"
          echo "=== DISPATCH BASE.H ==="
          sed -n '135,155p' "$SDK/usr/include/dispatch/base.h"

      - name: Inspect iSH Build Settings
        run: |
          echo "=== TARGET BUILD SETTINGS ==="
          xcodebuild             -project ish.xcodeproj             -scheme iSH-ARM64             -showBuildSettings             | grep -E "OTHER_CFLAGS|GCC_PREPROCESSOR_DEFINITIONS|HEADER_SEARCH_PATHS|CLANG_C|SWIFT"

      - name: Build iSH ARM64
        run: |
          set -o pipefail
          xcodebuild \
            -project iSH.xcodeproj \
            -scheme iSH-ARM64 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee xcode-build.log

      - name: Show build errors
        if: failure()
        run: |
          echo "===== XCODE BUILD ERRORS ====="
          grep -E "error:|fatal error:|BUILD FAILED" xcode-build.log | tail -50 || true

      - name: Find app
        if: success()
        run: |
          find . -name "*.app" -type d -print

      - name: Package IPA
        shell: bash
        run: |
          set -e

          echo "===== SEARCHING APP ====="

          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -type d -name "*.app" 2>/dev/null | grep "Build/Products" | head -1 || true)

          if [ -z "$APP" ]; then
            echo "No .app found in DerivedData"
            echo "===== ALL APP FILES ====="
            find "$HOME/Library/Developer/Xcode/DerivedData" -type d -name "*.app" 2>/dev/null || true
            exit 1
          fi

          echo "APP FOUND:"
          echo "$APP"

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP" Payload/

          echo "===== CREATING IPA ====="
          /usr/bin/zip -qry iSH-ARM64.ipa Payload

          echo "===== IPA CREATED ====="
          ls -lh iSH-ARM64.ipa

      - name: Inspect IPA
        run: |
          echo "===== PAYLOAD ====="
          find Payload -maxdepth 4 -print 2>/dev/null || true

          echo "===== APP EXECUTABLE ====="
          find Payload -type f -perm -111 -print 2>/dev/null || true

          echo "===== APP INFO ====="
          APP=$(find Payload -type d -name "*.app" | head -1)
          if [ -n "$APP" ]; then
            echo "APP=$APP"
            /usr/bin/file "$APP"/*
          fi

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: iSH-ARM64-IPA
          path: iSH-ARM64.ipa
