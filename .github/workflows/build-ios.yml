name: Build iSH ARM64 IPA

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'app/**'
      - 'iSH.xcodeproj/**'
      - '.github/workflows/build-ios.yml'

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          submodules: recursive

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version

      - name: Install build tools
        run: brew install meson ninja

      - name: Prepare iSH build
        run: git submodule update --init --recursive

      - name: Verify ARM64 terminal renderer
        run: |
          set -euo pipefail
          SETTINGS=$(xcodebuild \
            -project iSH.xcodeproj \
            -scheme iSH-ARM64 \
            -configuration Release \
            -showBuildSettings)
          echo "$SETTINGS" | grep 'GCC_PREPROCESSOR_DEFINITIONS' | head -1
          echo "$SETTINGS" | grep -q 'USE_XTERM_RENDERER=1'
          echo 'xterm renderer enabled for iSH-ARM64'

      - name: Build iSH ARM64
        run: |
          set -o pipefail
          rm -rf build-arm64
          xcodebuild \
            -project iSH.xcodeproj \
            -scheme iSH-ARM64 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee xcode-build.log

      - name: Show build errors
        if: failure()
        run: grep -E 'error:|fatal error:|BUILD FAILED' xcode-build.log | tail -100 || true

      - name: Locate built app
        run: |
          set -euo pipefail
          APP=$(find build-arm64/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' | head -1)
          test -n "$APP"
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "Built app: $APP"

      - name: Verify terminal resources
        run: |
          set -euo pipefail
          test -f "$APP/xterm-term.html"
          test -f "$APP/xterm-term-bridge.js"
          test -f "$APP/xterm-vendor/xterm-classic.js"
          test -f "$APP/xterm-vendor/addon-canvas.js"
          test -f "$APP/xterm-vendor/xterm.css"
          test -f "$APP/term.css"
          echo 'Required xterm terminal resources are packaged.'

      - name: Package IPA
        run: |
          set -euo pipefail
          rm -rf Payload iSH-ARM64.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry iSH-ARM64.ipa Payload
          unzip -l iSH-ARM64.ipa | grep -E 'xterm-term.html|xterm-term-bridge.js|xterm-classic.js|addon-canvas.js|xterm.css|term.css'
          ls -lh iSH-ARM64.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: iSH-ARM64-IPA
          path: iSH-ARM64.ipa
