name: Build iSH ARM64 IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List schemes
        run: |
          xcodebuild -project iSH.xcodeproj -list

      - name: Build iSH ARM64
        run: |
          set -o pipefail

          xcodebuild \
            -project iSH.xcodeproj \
            -scheme iSH-ARM64 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee xcode-build.log

      - name: Show Xcode errors
        if: failure()
        run: |
          echo "===== XCODE ERRORS ====="
          grep -E "error:|fatal error:|BUILD FAILED" xcode-build.log | tail -50 || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-log
          path: xcode-build.log

      - name: Show build errors
        if: failure()
        run: |
          echo "===== BUILD ERRORS ====="
          if [ -f xcode-build.log ]; then
            grep -E "error:|fatal error:|BUILD FAILED" xcode-build.log | tail -50 || true
          fi

      - name: Find app
        run: |
          find ~/Library/Developer/Xcode/DerivedData \
            -name "iSH-ARM64.app" \
            -type d \
            -print

      - name: Package IPA
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData \
            -name "iSH-ARM64.app" \
            -type d | head -1)

          mkdir -p Payload
          cp -R "$APP" Payload/iSH-ARM64.app
          zip -r iSH-ARM64-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: iSH-ARM64-IPA
          path: iSH-ARM64-unsigned.ipa
