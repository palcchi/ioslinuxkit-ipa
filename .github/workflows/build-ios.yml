name: Build iSH ARM64 IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List schemes
        run: xcodebuild -project iSH.xcodeproj -list

      - name: Build iSH ARM64
        run: |
          set -o pipefail
          xcodebuild \
            -project iSH.xcodeproj \
            -scheme iSH-ARM64 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee xcode-build.log

      - name: Show build errors
        if: failure()
        run: |
          echo "===== XCODE BUILD ERRORS ====="
          grep -E "error:|fatal error:|BUILD FAILED" xcode-build.log | tail -50 || true

      - name: Find app
        if: success()
        run: |
          find . -name "*.app" -type d -print

      - name: Package IPA
        if: success()
        run: |
          APP=$(find . -name "*.app" -type d | head -1)
          test -n "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r iSH-ARM64.ipa Payload

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: iSH-ARM64-IPA
          path: iSH-ARM64.ipa
